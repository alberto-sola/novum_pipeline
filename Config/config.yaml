#----- miRNAs -----#
query: Data/Raw/validated_bacteroides.fa

#----- Genomes, even more than one -----#
targets:
  bacteroides_thetaiotaomicron_w_calibration: Data/Raw/GCF_014131755.1_ASM1413175v1_cds_from_genomic_bacteroides_thetaiotaomicron.fna

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  enabled: true
  k: 50000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  threads: 16
  species: 3utr_human
  hits: null
  u: null
  v: null
  energy: -18
  pvalue: null
  seed: null
  distribution: null

#----- Parameters for tidying outputs -----#
tidy_rnahybrid: {}

#----- Parameters for annotating outputs -----#
annotate_rnahybrid: {}

#----- Where outputs should be generated -----#
results_dir: Data/Results/bacteroides_thetaiotaomicron