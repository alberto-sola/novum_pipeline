#----- miRNAs -----#
query: Data/Raw/validated_bacteroides.fa

#----- Genomes, even more than one -----#
targets:
  porcodio: Data/Raw/GCF_014131755.1_ASM1413175v1_cds_from_genomic_bacteroides_thetaiotaomicron.fna

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  mode: both        # "calibrated" | "uncalibrated" | "both"
  k: 10000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  threads: 16
  species: 3utr_human
  hits: null
  u: null
  v: null
  energy: -18
  pvalue: null
  seed: null
  distribution: null

#----- Parameters for tidying outputs -----#
tidy_rnahybrid: {}

#----- Parameters for annotating outputs -----#
annotate_rnahybrid: {}

#----- Where outputs should be generated -----#
results_dir: Data/Results/

#----- Parameters for plots (optional; omit or set type: null to skip) -----#
build_plots:
  # pvalue_distribution | position_pvalue | position_energy | all
  # or a comma-separated subset, e.g. "pvalue_distribution,position_pvalue"
  type: all
  basesize: 12
  pvalue: 0.01                  # cutoff for position_pvalue and position_energy
  locus:                        # YAML list of validated-hit locus_tags
    - FE838_RS16060
    - FE838_RS16090
    - FE838_RS16070
    - FE838_RS16075
    - FE838_RS16085
    - FE838_RS16065
    - FE838_RS16080
  gene:                          # YAML list of validated-hit gene_names