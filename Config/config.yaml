#----- miRNAs (one query FASTA per target sample, joined by key) -----#
queries:
  bacteroides: Data/Raw/validated_bacteroides.fa
#  escherichia: Data/Raw/validated_escherichia.fa

#----- Genomes, even more than one -----#
targets:
  bacteroides: Data/Raw/GCF_014131755.1_ASM1413175v1_cds_from_genomic_bacteroides_thetaiotaomicron.fna
#  escherichia: Data/Raw/GCF_000005845.2_ASM584v2_cds_from_genomic_escherichia_coli.fna

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  # calibrated | uncalibrated | both
  mode: both
  k: 10000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  threads: 16
  species: 3utr_human
  hits: null
  u: null
  v: null
  energy: -18
  pvalue: null
  seed: null
  distribution: null

#----- Parameters for tidying outputs -----#
tidy_rnahybrid: {}

#----- Parameters for annotating outputs -----#
annotate_rnahybrid: {}

#----- Parameters for plots (optional; omit or set type: null to skip) -----#
build_plots:
  # pvalue_distribution | position_pvalue | position_energy | all
  # or a comma-separated subset, e.g. "pvalue_distribution,position_pvalue"
  type: all
  basesize: 12
  pvalue: 0.01
  # entry,miRNA
  locus:
    - FE838_RS16060
    - FE838_RS16090
    - FE838_RS16070
    - FE838_RS16075
    - FE838_RS16085
    - FE838_RS16065
    - FE838_RS16080
  gene:
  protein:

#----- Where outputs should be generated -----#
results_dir: Data/Results/