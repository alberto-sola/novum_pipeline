#----- miRNAs -----#
query: Data/Raw/validated_escherichia.fa

#----- Genomes, even more than one -----#
targets:
  porcodio: Data/Raw/GCF_000005845.2_ASM584v2_cds_from_genomic_escherichia_coli.fna

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  mode: both        # "calibrated" | "uncalibrated" | "both"
  k: 10000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  threads: 16
  species: 3utr_human
  hits: null
  u: null
  v: null
  energy: -18
  pvalue: null
  seed: null
  distribution: null

#----- Parameters for tidying outputs -----#
tidy_rnahybrid: {}

#----- Parameters for annotating outputs -----#
annotate_rnahybrid: {}

#----- Where outputs should be generated -----#
results_dir: Data/Results/

#----- Parameters for plots (optional; omit or set type: null to skip) -----#
build_plots:
  type: pvalue_distribution     # pvalue_distribution | position_pvalue | position_energy | all
  basesize: 12
  pvalue: 0.01                  # cutoff for position_pvalue and position_energy
  locus:                        # YAML list of validated-hit locus_tags
    - LGG_RS02140
    - LGG_RS02130
  gene:                         # YAML list of validated-hit gene_names
    - yegH
    - spaC