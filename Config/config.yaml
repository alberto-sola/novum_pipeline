#----- miRNAs (one query FASTA per target sample, joined by key) -----#
queries:
  escherichia_coli: Data/Raw/RNAs/escherichia_coli.fa
  fusobacterium_nucleatum: Data/Raw/RNAs/fusobacterium_nucleatum.fa

#----- Genomes, even more than one -----#
targets:
  escherichia_coli: Data/Raw/genomes/GCF_000005845.2_ASM584v2_cds_from_genomic.fna
  fusobacterium_nucleatum: Data/Raw/genomes/GCF_003019295.1_ASM301929v1_cds_from_genomic.fna

#----- Shared by both arms -----#
threads: 16
max_suboptimal_hits: 3                # null → keep every hit below the arm's energy cutoff, per pair, on BOTH arms
seed: 2,7                             # Forced seed as "x,y" query positions; drives BOTH arms.
                                      # RNAhybrid → -f x,y ; IntaRNA → --seedBP/--seedQRange/--seedMaxUP=0.
                                      # null → no seed on either arm (IntaRNA emits --noSeed).

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  calibration_variant: on             # "on" | "off" | "both"
  k: 10000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  species: 3utr_human
  max_hybrid_energy: -18              # -e  hybridization MFE; the literature threshold
  max_internal_loop: 4
  max_bulge_loop: 4
  pvalue_threshold: null
  distribution: null

#----- Parameters for IntaRNA -----#
intarna:
  accessibility_variant: on           # "on" | "off" | "both"
  prediction_mode: H                  # H heuristic | M exact | S seed-only
  model: X                            # X seed-extension | S legacy | B helix-block | P ensemble
  energy_set: Turner04                # --energyVRNA  Turner99 | Turner04 | Andronescu07
  max_hybrid_energy: -12.9            # E_hybrid gate = -18 + 5.10 measured offset. NOT seed.max_hybrid_energy.
  accessibility_search_depth: 20      # --outNumber FLOOR on w_accessibility only: acc=C ranks by total E while the gate is on E_hybrid, so the MFE site can fall outside top-1.
  max_interaction_length: 0           # --intLenMax   (null/0 = auto: min of seq length, accW)
  max_loop_size: 4                    # --intLoopMax  unpaired nt between paired bases (null = 10)

  helix:                              # ONLY applies when model: B (helix-block). Ignored under X/S/P.
    min_bp: null                      # --helixMinBP  (default 2,  range [2,4])
    max_bp: null                      # --helixMaxBP  (default 10, range [2,20]); must be >= the seed width
    max_internal_loop: null           # --helixMaxIL  (default 0 = pure stacks, range [0,2])
    min_unpaired_probability: null    # --helixMinPu  (inert when accessibility_variant: off)
    max_energy: null                  # --helixMaxE   (default 0 = a helix must be stabilizing)
    full_energy: false                # --helixFullE  makes max_energy count E_init, ED, dangling ends

  seed:                               # enabled / length / query_range are inherited from the top-level `seed`.
    max_energy: null                  # --seedMaxE
    max_hybrid_energy: null           # --seedMaxEhybrid
    min_unpaired_probability: null    # --seedMinPu
    forbid_gu: false                  # --seedNoGU
    forbid_gu_at_ends: false          # --seedNoGUend
    target_range: null                # --seedTRange   (target coords; no top-level source)
    max_unpaired_bases: null          # --seedMaxUP    null → 0 under a seed (RNAhybrid parity)
    report_best_only: false           # --outBestSeedOnly

  accessibility:
    window: null                      # --accW  (0 → RNAup-like global; null → IntaRNA default ~150)
    max_bp_span: null                 # --accL  (0 → global; null → IntaRNA default ~100)
    forbid_lonely_pairs: false        # --accNoLP
    forbid_gu_at_ends: false          # --accNoGUend

  output:
    max_delta_energy: null            # --outDeltaE
    overlap: B                        # --outOverlap N|T|Q|B
    min_unpaired_probability: null    # --outMinPu
    forbid_lonely_pairs: false        # --outNoLP
    forbid_gu_at_ends: false          # --outNoGUend
    columns: id1,id2,start1,end1,start2,end2,subseqDP,hybridDP,E,E_hybrid,ED1,ED2,Pu1,Pu2,seedStart1,seedEnd1,seedE,seedStart2,seedEnd2

#----- Parameters for plots (optional; omit or set type: null to skip) -----#
plots:
  type: null                           # pvalue_distribution | position_pvalue | position_energy | volcano | pvalue_ecdf | calibration_delta | per_mirna | position_density | seed_class | all
                                       # or a comma-separated subset, e.g. "pvalue_distribution,position_pvalue"
  basesize: 12
  pvalue_threshold: 0.01
  per_mirna_top_n: 12
  locus:
  gene:
  protein:

#----- Where outputs should be generated -----#
results_dir: Data/Results/
