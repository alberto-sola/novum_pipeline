#----- miRNAs -----#
query: Data/Raw/validated_escherichia.fa

#----- Genomes, even more than one -----#
targets:
  escherichia_coli: Data/Raw/GCF_000005845.2_ASM584v2_cds_from_genomic_escherichia_coli.fna

#----- Parameters for RNAcalibrate -----#
calibration:
  enabled: true
  k: 5000
  max_target_length: 50000
  randomize_targets: false

#----- Parameters for RNAhybrid -----#
rnahybrid:
  threads: 16
  species: 3utr_human
  hits: null
  u: 3
  v: 3
  energy: -20
  pvalue: null
  seed: null
  distribution: null

#----- Parameters for tidying outputs -----#
tidy_rnahybrid: {}

#----- Parameters for annotating outputs -----#
annotate_rnahybrid: {}

#----- Where outputs should be generated -----#
results_dir: Data/Results/04_01/003_
