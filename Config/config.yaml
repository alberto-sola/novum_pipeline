#----- miRNAs (one query FASTA per target sample, joined by key) -----#
queries:
  escherichia: Data/Raw/RNAs/validated_escherichia.fa

#----- Genomes, even more than one -----#
targets:
  escherichia: Data/Raw/genomes/GCF_000005845.2_ASM584v2_cds_from_genomic_escherichia_coli.fna

# ─── Shared across both arms ────────────────────────────────────────────────
threads: 16

hits: null                  # null → 1 per pair (tool default); set to N to get N hits per pair

# With --acc=C (IntaRNA default), --outMaxE filters total E including accessibility
# penalties (ED1+ED2), so it is not directly comparable to RNAhybrid's -e which
# filters pure hybridisation energy. They match exactly only when
# intarna.accessibility: off.
max_energy: -18

# "x,y" in query (miRNA) coordinates.
# RNAhybrid receives it verbatim as -f x,y.
# IntaRNA derives --seedBP, --seedQRange, and --seedMaxUP=0 from it.
seed: null

#----- Parameters for RNAcalibrate -----#
rnacalibrate:
  # calibrated | uncalibrated | both
  mode: both
  k: 10000
  max_target_length: 50000
  randomize_targets: true

#----- Parameters for RNAhybrid -----#
rnahybrid:
  species: 3utr_human
  internal_loop_max: null
  bulge_loop_max: null
  pvalue: null
  distribution: null

#----- Parameters for plots (optional; omit or set type: null to skip) -----#
build_plots:
  # pvalue_distribution | position_pvalue | position_energy |
  # volcano | pvalue_ecdf | calibration_delta | per_mirna |
  # position_density | seed_class | all
  # or a comma-separated subset, e.g. "pvalue_distribution,position_pvalue"
  type: all
  basesize: 12
  pvalue: 0.01
  # cap for plot_per_mirna (top-N miRNAs by hit count)
  per_mirna_top_n: 12
  # entry,miRNA
  locus:
  gene:
    - yegH
    - trmL
  protein:

#----- Parameters for IntaRNA -----#
intarna:
  # Drives w_accessibility / wo_accessibility variants (mirrors rnacalibrate.mode).
  # The variant differs only in --acc=N vs --acc=C; mode, model, int_len_max,
  # int_loop_max, and seed.* apply uniformly to both.
  accessibility: "on"          # "on" | "off" | "both"

  # Interaction model
  mode: H                      # H heuristic | M exact | S seed-only
  model: S                     # X seed-extension | S legacy | B helix-block | P ensemble
  int_len_max: 0               # 0 = auto (min of seq length, accW)
  int_loop_max: 10

  # Seed (wo_accessibility: set disable: true to suppress seed enforcement)
  seed:


    disable: false             # when true, emit --noSeed and skip all other seed flags
    bp: null                   # null → derived from top-level seed; set explicitly to override [2..20]; if both null, IntaRNA default (7) applies
    max_E: null                # --seedMaxE
    max_E_hybrid: null         # --seedMaxEhybrid
    min_Pu: null               # --seedMinPu
    no_GU: false               # --seedNoGU
    no_GU_end: false           # --seedNoGUend
    q_range: null              # --seedQRange  null → derived from top-level seed; set explicitly to override
    t_range: null              # --seedTRange
    max_UP: null               # --seedMaxUP   null → set to 0 when top-level seed is set (RNAhybrid parity), else IntaRNA default
    out_best_only: false       # --outBestSeedOnly

  # Accessibility params (ignored when accessibility: "off" since --acc=N is used)
  accessibility_params:
    window: null               # --accW  (0 → RNAup-like global; null → IntaRNA default ~150)
    max_bp_span: null          # --accL  (0 → global; null → IntaRNA default ~100)
    no_lp: false               # --accNoLP
    no_gu_end: false           # --accNoGUend

  # Output filtering (both variants)
  output:
    delta_E: null              # --outDeltaE
    overlap: B                 # --outOverlap N|T|Q|B
    min_Pu: null               # --outMinPu
    no_lp: false               # --outNoLP
    no_gu_end: false           # --outNoGUend
    csv_cols: id1,id2,start1,end1,start2,end2,subseqDP,hybridDP,E,E_hybrid,ED1,ED2,Pu1,Pu2,seedStart1,seedEnd1,seedE,seedStart2,seedEnd2

  # Escape hatch: appended verbatim (e.g. helix-block flags, --accFile, --qRegion)
  extra_args: []

#----- Where outputs should be generated -----#
results_dir: Data/Results/
